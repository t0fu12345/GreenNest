openapi: 3.0.3
info:
  title: GreenNest REST API Specification
  description: >-
    Đặc tả giao diện lập trình ứng dụng RESTful API cho nền tảng triển lãm thực vật sinh học,
    chăm sóc cây trồng & giám sát thông số vi khí hậu GreenNest (Dự án eProject MERN Stack - Aptech).
  version: 1.0.0
  contact:
    name: GreenNest Development Team
    email: contact@greennest.botanical.vn
servers:
  - url: http://localhost:5000/api
    description: Máy chủ phát triển cục bộ (Local Development)
  - url: https://api.greennest.botanical.vn/api
    description: Máy chủ môi trường sản xuất (Production Server)

tags:
  - name: Auth
    description: Xác thực người dùng, đăng ký, đăng nhập JWT và quản lý hồ sơ cá nhân
  - name: Plants
    description: Tra cứu, tìm kiếm, lọc đa chiều và quản lý dữ liệu cây trồng (Public & Admin CRUD)
  - name: Gardeners
    description: Hồ sơ chuyên gia thực vật, nghệ nhân vườn ươm đối tác và cây trồng bảo trợ
  - name: Collections
    description: Bộ sưu tập cây trồng theo mùa, theo chủ đề không gian kiến trúc
  - name: Gallery
    description: Thư viện ảnh thực vật tương tác Lightbox, tương thích phím tắt và chú thích tác quyền
  - name: Garden
    description: Quản lý Vườn của tôi (My Garden), cơ chế đồng bộ lưỡng thể (Hybrid Sync) và Care Checklist
  - name: Contact
    description: Tiếp nhận tin nhắn liên hệ từ khách truy cập và xử lý hòm thư phản hồi của Admin
  - name: Admin
    description: Bảng điều khiển quản trị (Dashboard Stats & Metrics tổng hợp)
  - name: Metadata
    description: Dữ liệu tra cứu danh mục, môi trường sinh trưởng và thông số vi khí hậu

paths:
  # ============================================================================
  # AUTHENTICATION & USER PROFILE
  # ============================================================================
  /auth/register:
    post:
      tags:
        - Auth
      summary: Đăng ký tài khoản người dùng mới
      description: Tạo tài khoản thành viên mới với vai trò mặc định là 'user'. Mật khẩu được băm tự động bằng bcrypt (salt rounds = 10).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công, trả về JWT Token và thông tin tài khoản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '409':
          description: Email đã được đăng ký trong hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Đăng nhập vào hệ thống
      description: Xác thực thông tin đăng nhập email & mật khẩu, trả về JSON Web Token (JWT) và thông tin vai trò người dùng (user hoặc admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          description: Sai thông tin email hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /auth/me:
    get:
      tags:
        - Auth
      summary: Lấy thông tin tài khoản hiện tại
      description: Trả về thông tin chi tiết của người dùng đang đăng nhập dựa trên JWT token được gửi kèm trong Header.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy thông tin tài khoản thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/401Error'

  /auth/change-password:
    put:
      tags:
        - Auth
      summary: Đổi mật khẩu tài khoản
      description: Người dùng đăng nhập đổi mật khẩu bằng cách cung cấp mật khẩu hiện tại và mật khẩu mới.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Đổi mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'

  # ============================================================================
  # PLANTS DIRECTORY & CRUD ENDPOINTS
  # ============================================================================
  /plants:
    get:
      tags:
        - Plants
      summary: Danh sách cây trồng kèm tìm kiếm và bộ lọc đa chiều (FRS 2, 3)
      description: >-
        Tìm kiếm toàn văn theo tên cây / tên khoa học. Lọc linh hoạt theo danh mục (category),
        môi trường sinh trưởng (environment), mức độ ánh sáng (light), tần suất tưới (watering),
        độ khó chăm sóc (careLevel), và sắp xếp phân trang.
      parameters:
        - name: q
          in: query
          description: Từ khóa tìm kiếm Full-Text (tên phổ thông, tên khoa học)
          schema:
            type: string
            example: monstera
        - name: category
          in: query
          description: Lọc theo nhóm phân loại (Aroid, Foliage, Succulent, Fern, Flowering, Bonsai)
          schema:
            type: string
            example: Aroid
        - name: environment
          in: query
          description: Môi trường sinh trưởng (Indoor, Balcony, Partial Shade, Full Sun, Terrarium)
          schema:
            type: string
            example: Indoor
        - name: light
          in: query
          description: Yêu cầu ánh sáng (Bright Indirect, Low Light, Direct Sunlight)
          schema:
            type: string
            example: Bright Indirect
        - name: careLevel
          in: query
          description: Mức độ chăm sóc
          schema:
            type: string
            enum: [Easy, Moderate, Challenging]
            example: Easy
        - name: sort
          in: query
          description: Tiêu chí sắp xếp
          schema:
            type: string
            enum: [latest, name_asc, name_desc, popular]
            default: latest
        - name: page
          in: query
          description: Trang hiện tại (1-based index)
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Số lượng bản ghi mỗi trang
          schema:
            type: integer
            default: 12
      responses:
        '200':
          description: Danh sách cây trồng kèm siêu dữ liệu phân trang
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlantSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Plants
      summary: "[Admin] Thêm cây trồng mới vào cơ sở dữ liệu"
      description: Dành riêng cho Quản trị viên (Role Admin). Tạo một thực thể cây trồng mới với đầy đủ thông số kỹ thuật và hướng dẫn chăm sóc.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlantRequest'
      responses:
        '201':
          description: Tạo mới cây trồng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cây trồng mới đã được lưu thành công
                  data:
                    $ref: '#/components/schemas/PlantDetail'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'

  /plants/{id}:
    get:
      tags:
        - Plants
      summary: Xem chi tiết cây trồng & thông số vi khí hậu (FRS 4)
      description: Trả về thông tin chi tiết đầy đủ gồm tên khoa học, đất trồng, cỡ chậu, chu kỳ tưới, cảnh báo độc tính và hồ sơ chuyên gia bảo trợ.
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId MongoDB hoặc slug duy nhất của cây trồng
          schema:
            type: string
            example: 66f8e21a4f3b2c1d0e5a6b01
      responses:
        '200':
          description: Chi tiết cây trồng hoàn chỉnh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PlantDetail'
        '404':
          $ref: '#/components/responses/404Error'

    put:
      tags:
        - Plants
      summary: "[Admin] Cập nhật thông tin cây trồng"
      description: Chỉnh sửa toàn bộ hoặc một phần các trường dữ liệu của cây trồng. Yêu cầu quyền Quản trị viên.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId MongoDB của cây trồng cần chỉnh sửa
          schema:
            type: string
            example: 66f8e21a4f3b2c1d0e5a6b01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlantRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cập nhật cây trồng thành công
                  data:
                    $ref: '#/components/schemas/PlantDetail'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'

    delete:
      tags:
        - Plants
      summary: "[Admin] Xóa cây trồng khỏi hệ thống"
      description: Xóa vĩnh viễn bản ghi cây trồng khỏi MongoDB. Yêu cầu quyền Quản trị viên.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId MongoDB của cây trồng cần xóa
          schema:
            type: string
            example: 66f8e21a4f3b2c1d0e5a6b01
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'

  /plants/{id}/related:
    get:
      tags:
        - Plants
      summary: Gợi ý các loài cây tương tự (FRS 4)
      description: Trả về danh sách 4 cây tương tự dựa trên cùng nhóm phân loại (category) hoặc môi trường sinh trưởng (environment).
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId của cây hiện tại
          schema:
            type: string
            example: 66f8e21a4f3b2c1d0e5a6b01
      responses:
        '200':
          description: Danh sách cây gợi ý tương tự
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlantSummary'

  # ============================================================================
  # GARDENER PROFILES (EXPERTS & BOTANISTS)
  # ============================================================================
  /gardeners:
    get:
      tags:
        - Gardeners
      summary: Lấy danh sách chuyên gia thực vật & đối tác vườn ươm (FRS 5)
      description: Hiển thị danh sách hồ sơ chuyên gia bao gồm tên, chuyên môn, số năm kinh nghiệm và ảnh đại diện.
      responses:
        '200':
          description: Danh sách chuyên gia thực vật
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GardenerProfile'

    post:
      tags:
        - Gardeners
      summary: "[Admin] Thêm hồ sơ chuyên gia mới"
      description: Yêu cầu quyền Quản trị viên (Admin).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGardenerRequest'
      responses:
        '201':
          description: Tạo hồ sơ thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/GardenerProfile'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'

  /gardeners/{id}:
    get:
      tags:
        - Gardeners
      summary: Xem chi tiết hồ sơ chuyên gia & cây họ bảo trợ (FRS 5)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 66f8e21a4f3b2c1d0e5a6g01
      responses:
        '200':
          description: Chi tiết hồ sơ chuyên gia và các cây liên kết
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/GardenerDetail'
        '404':
          $ref: '#/components/responses/404Error'

    put:
      tags:
        - Gardeners
      summary: "[Admin] Cập nhật hồ sơ chuyên gia"
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 66f8e21a4f3b2c1d0e5a6g01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGardenerRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'

    delete:
      tags:
        - Gardeners
      summary: "[Admin] Xóa hồ sơ chuyên gia"
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 66f8e21a4f3b2c1d0e5a6g01
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'

  # ============================================================================
  # COLLECTIONS (SEASONAL & THEMATIC)
  # ============================================================================
  /collections:
    get:
      tags:
        - Collections
      summary: Danh sách bộ sưu tập theo mùa & chủ đề (FRS 8)
      description: Lấy danh sách các bộ sưu tập thực vật đặc tuyển (Ví dụ Ban công mùa hè, Cây lọc không khí, Cây ít bảo dưỡng).
      parameters:
        - name: season
          in: query
          description: Lọc theo mùa sinh trưởng
          schema:
            type: string
            enum: [all, spring, summer, autumn, winter]
            default: all
      responses:
        '200':
          description: Danh sách bộ sưu tập
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectionSummary'

    post:
      tags:
        - Collections
      summary: "[Admin] Tạo mới bộ sưu tập"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: Tạo bộ sưu tập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CollectionDetail'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'

  /collections/{id}:
    get:
      tags:
        - Collections
      summary: Chi tiết bộ sưu tập kèm danh sách các cây trồng thành phần (FRS 8)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 66f8e21a4f3b2c1d0e5a6c01
      responses:
        '200':
          description: Chi tiết bộ sưu tập
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CollectionDetail'
        '404':
          $ref: '#/components/responses/404Error'

    put:
      tags:
        - Collections
      summary: "[Admin] Cập nhật bộ sưu tập"
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 66f8e21a4f3b2c1d0e5a6c01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'

    delete:
      tags:
        - Collections
      summary: "[Admin] Xóa bộ sưu tập"
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 66f8e21a4f3b2c1d0e5a6c01
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'

  # ============================================================================
  # INTERACTIVE PLANT GALLERY (LIGHTBOX - FRS 6)
  # ============================================================================
  /gallery:
    get:
      tags:
        - Gallery
      summary: Lấy danh sách ảnh cho Thư viện ảnh tương tác Lightbox (FRS 6)
      description: >-
        Trả về danh sách ảnh chất lượng cao kèm thông tin alt text, caption miêu tả, nguồn trích dẫn
        (credit: Pinterest) và tỷ lệ khung hình phục vụ bố cục Bento Grid và Lightbox Modal.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: aspectRatio
          in: query
          schema:
            type: string
            enum: [all, tall, wide, square, large]
            default: all
      responses:
        '200':
          description: Danh sách ảnh gallery kèm thông tin tác quyền
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GalleryImage'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Gallery
      summary: "[Admin] Thêm ảnh mới vào Thư viện tương tác"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGalleryImageRequest'
      responses:
        '201':
          description: Thêm ảnh thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/GalleryImage'
        '400':
          $ref: '#/components/responses/400Error'

  /garden/sync:
    post:
      tags:
        - Garden
      summary: Đồng bộ dữ liệu Vườn của tôi từ LocalStorage sau khi Đăng nhập (Hybrid Sync - FRS 9)
      description: >-
        Khi người dùng duyệt web dưới tư cách khách (Guest), danh sách cây bookmark được lưu ở LocalStorage.
        Sau khi người dùng đăng nhập hoặc đăng ký thành công, Frontend sẽ gọi endpoint này để gộp các ID cây
        từ LocalStorage vào tài khoản MongoDB mà không làm mất dữ liệu cũ.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GardenSyncRequest'
      responses:
        '200':
          description: Đồng bộ hoàn tất
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đồng bộ thành công 4 cây vào Vườn của bạn
                  syncedCount:
                    type: integer
                    example: 4
                  totalGardenPlants:
                    type: array
                    items:
                      type: string
                      example: 66f8e21a4f3b2c1d0e5a6b01
        '401':
          $ref: '#/components/responses/401Error'


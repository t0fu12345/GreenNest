# ============================================================================
# COMPONENTS (SCHEMAS, RESPONSES, SECURITY)
# ============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Chuỗi mã thông báo xác thực JWT được cấp sau khi đăng nhập thành công. Gửi kèm theo Header Authorization 'Bearer <token>'.

  responses:
    400Error:
      description: Dữ liệu gửi lên không hợp lệ hoặc thiếu trường bắt buộc
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    401Error:
      description: Chưa xác thực danh tính hoặc phiên đăng nhập đã hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    403Error:
      description: Không có quyền truy cập (Yêu cầu tài khoản có vai trò Quản trị viên - Admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    404Error:
      description: Không tìm thấy tài nguyên yêu cầu trong hệ thống
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    # --------------------------------------------------------------------------
    # CHUNG / BASE RESPONSES
    # --------------------------------------------------------------------------
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Thao tác thực hiện thành công

    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu gửi lên không đúng định dạng yêu cầu
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              issue:
                type: string
                example: Email không đúng định dạng

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 12
        totalItems:
          type: integer
          example: 24
        totalPages:
          type: integer
          example: 2

    # --------------------------------------------------------------------------
    # AUTHENTICATION & USER SCHEMAS
    # --------------------------------------------------------------------------
    RegisterRequest:
      type: object
      required:
        - fullName
        - email
        - password
      properties:
        fullName:
          type: string
          example: Lê Hoàng Nam
        email:
          type: string
          format: email
          example: nam.le@greennest.vn
        password:
          type: string
          minLength: 6
          example: GreenNest@2026

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: nam.le@greennest.vn
        password:
          type: string
          example: GreenNest@2026

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: string
          example: 66f8e21a4f3b2c1d0e5a6a01
        fullName:
          type: string
          example: Lê Hoàng Nam
        email:
          type: string
          example: nam.le@greennest.vn
        role:
          type: string
          enum: [user, admin]
          example: user
        avatarUrl:
          type: string
          nullable: true
          example: https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80
        createdAt:
          type: string
          format: date-time
          example: 2026-10-13T08:00:00Z

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          example: GreenNest@2026
        newPassword:
          type: string
          minLength: 6
          example: GreenNest@New2027

    # --------------------------------------------------------------------------
    # PLANT SCHEMAS
    # --------------------------------------------------------------------------
    PlantSummary:
      type: object
      properties:
        id:
          type: string
          example: 66f8e21a4f3b2c1d0e5a6b01
        name:
          type: string
          example: Monstera Deliciosa (Trầu Bà Nam Mỹ)
        botanicalName:
          type: string
          example: Monstera deliciosa Liebm.
        slug:
          type: string
          example: monstera-deliciosa
        category:
          type: string
          example: Aroid
        environment:
          type: string
          example: Indoor
        light:
          type: string
          example: Bright Indirect Light
        watering:
          type: string
          example: 1-2 lần/tuần
        careLevel:
          type: string
          example: Easy
        primaryImage:
          type: string
          example: https://i.pinimg.com/736x/07/70/4e/07704e6c382ce7dc8e580a82b0be81f9.jpg
        isPetSafe:
          type: boolean
          example: false

    PlantDetail:
      type: object
      properties:
        id:
          type: string
          example: 66f8e21a4f3b2c1d0e5a6b01
        name:
          type: string
          example: Monstera Deliciosa (Trầu Bà Nam Mỹ)
        botanicalName:
          type: string
          example: Monstera deliciosa Liebm.
        slug:
          type: string
          example: monstera-deliciosa
        category:
          type: string
          example: Aroid
        environment:
          type: string
          example: Indoor
        description:
          type: string
          example: Loài thực vật biểu tượng của thiết kế nội thất hiện đại với những chiếc xẻ lá ngoạn mục.
        light:
          type: string
          example: Bright Indirect Light
        watering:
          type: string
          example: 1-2 lần/tuần khi lớp đất mặt khô 3-5cm
        careLevel:
          type: string
          enum: [Easy, Moderate, Challenging]
          example: Easy
        temperature:
          type: string
          example: 18°C - 30°C
        humidity:
          type: string
          example: 60% - 80%
        toxicity:
          type: object
          properties:
            dogs:
              type: boolean
              example: true
            cats:
              type: boolean
              example: true
            humans:
              type: boolean
              example: false
            note:
              type: string
              example: Chứa tinh thể Canxi Oxalat gây kích ứng nếu thú cưng nhai phải.
        careInstructions:
          type: object
          properties:
            soil:
              type: string
              example: Hỗn hợp đất tơi xốp, phối trộn xơ dừa, perlite và vỏ thông thoát nước tốt.
            potting:
              type: string
              example: Chậu gốm nung có lỗ thoát nước lớn, đường kính từ 25-30cm.
            fertilizer:
              type: string
              example: Bón phân hữu cơ tan chậm hoặc phân NPK hòa loãng mỗi tháng 1 lần vào mùa sinh trưởng.
            pruning:
              type: string
              example: Lau sạch bụi trên phiến lá định kỳ bằng khăn ẩm mềm để tối ưu quang hợp.
        images:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                example: https://i.pinimg.com/736x/07/70/4e/07704e6c382ce7dc8e580a82b0be81f9.jpg
              alt:
                type: string
                example: Monstera Deliciosa trong không gian ánh sáng tự nhiên
              isPrimary:
                type: boolean
                example: true
        gardener:
          $ref: '#/components/schemas/GardenerProfile'
        status:
          type: string
          enum: [published, draft]
          example: published
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePlantRequest:
      type: object
      required:
        - name
        - botanicalName
        - category
        - environment
        - light
        - watering
      properties:
        name:
          type: string
          example: Calathea Orbifolia (Đuôi Công Tròn)
        botanicalName:
          type: string
          example: Calathea orbifolia
        category:
          type: string
          example: Foliage
        environment:
          type: string
          example: Indoor
        description:
          type: string
          example: Cây kiểng lá với những vân sọc xanh bạc tinh tế như tranh vẽ.
        light:
          type: string
          example: Medium to Low Light
        watering:
          type: string
          example: Tưới đều đặn 2 lần/tuần, giữ ẩm đất
        careLevel:
          type: string
          enum: [Easy, Moderate, Challenging]
          example: Moderate
        temperature:
          type: string
          example: 20°C - 26°C
        humidity:
          type: string
          example: 65% - 85%
        toxicity:
          type: object
          properties:
            dogs:
              type: boolean
              example: false
            cats:
              type: boolean
              example: false
            note:
              type: string
              example: Hoàn toàn không độc hại, thân thiện với thú nuôi.
        careInstructions:
          type: object
          properties:
            soil:
              type: string
            potting:
              type: string
            fertilizer:
              type: string
            pruning:
              type: string
        images:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              alt:
                type: string
              isPrimary:
                type: boolean
        gardenerId:
          type: string
          example: 66f8e21a4f3b2c1d0e5a6g01
        status:
          type: string
          enum: [published, draft]
          default: published

    UpdatePlantRequest:
      type: object
      properties:
        name:
          type: string
        botanicalName:
          type: string
        category:
          type: string
        environment:
          type: string
        description:
          type: string
        light:
          type: string
        watering:
          type: string
        careLevel:
          type: string
        temperature:
          type: string
        humidity:
          type: string
        toxicity:
          type: object
        careInstructions:
          type: object
        images:
          type: array
        gardenerId:
          type: string
        status:
          type: string
          enum: [published, draft]

    # --------------------------------------------------------------------------
    # GARDENER SCHEMAS
    # --------------------------------------------------------------------------
    GardenerProfile:
      type: object
      properties:
        id:
          type: string
          example: 66f8e21a4f3b2c1d0e5a6g01
        name:
          type: string
          example: Dr. Elena Vance
        avatar:
          type: string
          example: https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=400&q=80
        specialization:
          type: string
          example: Nhà thực vật học & Giám tuyển khí hậu nhiệt đới
        experienceYears:
          type: integer
          example: 12
        contactEmail:
          type: string
          example: elena.vance@greennest.vn

    GardenerDetail:
      type: object
      properties:
        id:
          type: string
          example: 66f8e21a4f3b2c1d0e5a6g01
        name:
          type: string
          example: Dr. Elena Vance
        avatar:
          type: string
          example: https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=400&q=80
        bio:
          type: string

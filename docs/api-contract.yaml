    # --------------------------------------------------------------------------
    MyGardenPayload:
      type: object
      properties:
        plants:
          type: array
          items:
            $ref: '#/components/schemas/PlantSummary'
        checklists:
          type: array
          items:
            type: object
            properties:
              plantId:
                type: string
                example: 66f8e21a4f3b2c1d0e5a6b01
              wateredAt:
                type: string
                format: date-time
                nullable: true
                example: 2026-10-12T09:00:00Z
              fertilizedAt:
                type: string
                format: date-time
                nullable: true
              prunedAt:
                type: string
                format: date-time
                nullable: true
              notes:
                type: string
                example: Cây vừa đâm thêm 2 búp lá mới rất khỏe.

    GardenSyncRequest:
      type: object
      required:
        - plantIds
      properties:
        plantIds:
          type: array
          items:
            type: string
            example: 66f8e21a4f3b2c1d0e5a6b01
          description: Mảng các ID cây trồng người dùng đã lưu trữ trong LocalStorage khi chưa đăng nhập

    UpdateChecklistRequest:
      type: object
      properties:
        actionType:
          type: string
          enum: [water, fertilize, prune, repot, reset]
          example: water
        notes:
          type: string
          example: Đã tưới ẩm đất và phun sương lá buổi sáng.

